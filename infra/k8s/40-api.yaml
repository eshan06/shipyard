# ──────────────────────────────────────────────────────────────────────────
# Shipyard API — Fastify control plane. Deployment + Service.
# Liveness => /healthz (process up); Readiness => /readyz (Postgres + Redis
# reachable, returns 503 until both are). Run the migrate Job first.
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipyard-api
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shipyard
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # Replace OWNER + tag with your registry/image.
          image: ghcr.io/OWNER/shipyard-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: shipyard-config
            - secretRef:
                name: shipyard-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: shipyard-api
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 4000
      targetPort: http
