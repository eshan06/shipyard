# ──────────────────────────────────────────────────────────────────────────
# Shipyard secrets — TEMPLATE / PLACEHOLDER ONLY.
#
# DO NOT commit real values. This manifest exists so the deployment references a
# named Secret; create the real one out-of-band, e.g.:
#
#   kubectl -n shipyard create secret generic shipyard-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASS@postgres:5432/shipyard?schema=public' \
#     --from-literal=REDIS_URL='redis://redis:6379' \
#     --from-literal=SECRETS_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=SESSION_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=GITHUB_OAUTH_CLIENT_ID='' \
#     --from-literal=GITHUB_OAUTH_CLIENT_SECRET='' \
#     --from-literal=GITHUB_WEBHOOK_SECRET=''
#
# Prefer a sealed-secrets / external-secrets operator or your cloud secret
# manager in real environments. `stringData` is used so values are plain text in
# this template; Kubernetes base64-encodes them on apply.
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: shipyard-secrets
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
type: Opaque
stringData:
  DATABASE_URL: "postgresql://shipyard:CHANGE_ME@postgres:5432/shipyard?schema=public"
  REDIS_URL: "redis://redis:6379"
  # 32-byte base64 key: openssl rand -base64 32
  SECRETS_ENCRYPTION_KEY: "REPLACE_ME_BASE64_32_BYTES"
  # >= 32 chars: openssl rand -hex 32
  SESSION_SECRET: "REPLACE_ME_HEX_64_CHARS"
  GITHUB_OAUTH_CLIENT_ID: ""
  GITHUB_OAUTH_CLIENT_SECRET: ""
  GITHUB_WEBHOOK_SECRET: ""
