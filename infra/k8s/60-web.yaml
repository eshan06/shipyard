# ──────────────────────────────────────────────────────────────────────────
# Shipyard web — Next.js dashboard (`next start`). Deployment + Service.
# The browser talks to the API same-origin via /api/v1, proxied by the web
# app's catch-all Route Handler, which resolves its upstream at RUNTIME as
# API_URL ?? NEXT_PUBLIC_API_URL — in-cluster both point at the API Service
# (set in the ConfigMap). A simple `GET /` liveness/readiness is sufficient
# (no DB deps).
# ──────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipyard-web
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
    app.kubernetes.io/component: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: shipyard
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          # Substitution point — see infra/k8s/README.md. OWNER → your GHCR
          # namespace; REPLACE_TAG → the immutable release tag CI pushed. NOTE the
          # web image bakes NEXT_PUBLIC_* at BUILD time (build-args), so the
          # API_URL / NEXT_PUBLIC_API_URL runtime env below only feeds the
          # server-side Route Handler proxy.
          image: ghcr.io/OWNER/shipyard-web:REPLACE_TAG
          # Safe with an IMMUTABLE tag: a fresh REPLACE_TAG is never cached on the
          # node, so it is always pulled on rollout. If you deploy a MUTABLE tag
          # (e.g. `latest`) instead, change this to `Always`.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: shipyard-config
                  key: API_URL
            - name: NEXT_PUBLIC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: shipyard-config
                  key: NEXT_PUBLIC_API_URL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: shipyard-web
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
