# ──────────────────────────────────────────────────────────────────────────
# Non-secret configuration for the Shipyard control plane.
#
# Secrets (DATABASE_URL, REDIS_URL, SECRETS_ENCRYPTION_KEY, SESSION_SECRET,
# GitHub creds) live in the `shipyard-secrets` Secret, created out-of-band — NOT
# here, and NOT from the `20-secret.example.yaml` template (see infra/k8s/README.md
# and DEPLOYMENT.md §4). The in-cluster
# DNS names below assume Postgres/Redis run inside the cluster (e.g. via the
# Bitnami charts or the StatefulSet of your choice) reachable at `postgres` /
# `redis`. If you use a managed DB/cache, drop those connection strings into the
# Secret instead and remove the matching keys here.
# ──────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipyard-config
  namespace: shipyard
  labels:
    app.kubernetes.io/part-of: shipyard
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"

  # --- API ---
  API_HOST: "0.0.0.0"
  API_PORT: "4000"
  # Public URLs the API advertises (CORS origin + OAuth redirects). Replace the
  # hostnames with your real ingress domains.
  PUBLIC_API_URL: "https://api.shipyard.example.com"
  PUBLIC_APP_URL: "https://shipyard.example.com"
  PREVIEW_BASE_DOMAIN: "preview.shipyard.example.com"
  DEV_AUTH: "false"
  # How much of X-Forwarded-* to trust (client IP for rate limiting / audit).
  # In-cluster the API is only reachable through ingress-nginx (which sets XFF
  # itself), so trusting one hop is correct. If pods can hit the API Service
  # directly from untrusted workloads, tighten this to the ingress controller's
  # pod CIDR (e.g. "10.244.0.0/16") so they cannot spoof X-Forwarded-For.
  TRUST_PROXY: "1"
  RATE_LIMIT_MAX: "200"
  RATE_LIMIT_WINDOW: "1 minute"

  # --- Observability ---
  # /metrics on the API (main port) and the worker (dedicated :9090 server).
  # NOTE: the worker's liveness probe targets /healthz on the SAME server
  # (50-worker.yaml) — if you turn METRICS_ENABLED off, remove that probe too
  # or the pod will crashloop. The public ingress denies /metrics (70-ingress).
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"

  # --- Worker ---
  DEPLOY_DRIVER: "mock" # set to "docker" only where the worker has a Docker daemon
  WORKER_CONCURRENCY: "4"
  CLEANUP_INTERVAL_MS: "60000"
  COST_INTERVAL_MS: "300000"
  PREVIEW_AUTO_STOP_MINUTES: "120"
  PREVIEW_DESTROY_TTL_MINUTES: "60"
  COST_PER_VCPU_HOUR: "0.04"
  COST_PER_GB_MEM_HOUR: "0.005"
  COST_PER_GB_STORAGE_HOUR: "0.0002"
  COST_PER_GB_EGRESS: "0.09"

  # --- Web ---
  # The browser talks to the API same-origin through the web app's catch-all
  # Route Handler proxy (apps/web/src/app/api/v1/[...path]/route.ts), which
  # resolves its upstream at RUNTIME as API_URL ?? NEXT_PUBLIC_API_URL.
  # In-cluster, point it at the API Service.
  API_URL: "http://shipyard-api:4000"
  NEXT_PUBLIC_API_URL: "http://shipyard-api:4000"
