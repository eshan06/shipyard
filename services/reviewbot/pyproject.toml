[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shipyard-reviewbot"
version = "0.1.0"
description = "LLM code review worker for Shipyard: consumes PR review jobs, analyzes diffs for bugs/security/style, posts findings back to the PR."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "bullmq>=2.7",
    "redis>=5.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["reviewbot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
